<!DOCTYPE html>

<body class="quote-body list-body">
  <div id="lan-hint" class="lan-hint no-print" hidden></div>
  <div id="phone-sheet" class="phone-sheet no-print" hidden></div>
  <div class="quote-list-page">
    <header class="list-header">
      <div>
        <img class="list-logo" src="images/car2witch-logo.jpg" alt="CarSwitch">
        <h1>Saved Invoices &amp; Agreements</h1>

      <div class="list-header-actions">

        <a class="quote-btn quote-btn-save" href="agreement.html">New sales agreement</a>

        <button type="button" class="staff-chip" data-person="Rakitha">Rakitha</button>

    <p class="list-count" id="summary">0 agreements</p>
    <div id="agree-list"></div>
  </div>
