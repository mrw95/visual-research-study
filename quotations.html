<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CarSwitch — Saved Quotations</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="static/quotation.css?v=26">
</head>
<body class="quote-body list-body">
  <div class="quote-list-page">
    <header class="list-header">
      <div>
        <img class="list-logo" src="images/car2witch-logo.jpg" alt="CarSwitch">
        <h1>Saved Quotations</h1>
        <p class="list-sub" id="folder-hint">Prepared By name එකට අදාළ folder එකට save වෙනවා.</p>
      </div>
      <a class="quote-btn quote-btn-save" href="quotation.html">New quotation</a>
    </header>

    <section class="list-card">
      <label class="list-search-label" for="search">Search</label>
      <input id="search" type="search" placeholder="Quotation No, customer, phone, model...">
      <div class="staff-chips" id="staff-filters">
        <button type="button" class="staff-chip selected" data-person="">All</button>
        <button type="button" class="staff-chip" data-person="Nipun">Nipun</button>
        <button type="button" class="staff-chip" data-person="Isuru">Isuru</button>
        <button type="button" class="staff-chip" data-person="Malki">Malki</button>
        <button type="button" class="staff-chip" data-person="Harshani">Harshani</button>
        <button type="button" class="staff-chip" data-person="Rakitha">Rakitha</button>
      </div>
    </section>

    <p class="list-count" id="summary">0 quotations</p>
    <div id="list"></div>
  </div>
  <script src="static/quotation.js?v=23"></script>
</body>
</html>
